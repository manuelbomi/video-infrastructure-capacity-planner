[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-infrastructure-capacity-planner"
version = "0.1.0"
description = "Sizing / capacity-planning calculator for video surveillance and video-analytics deployments"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "matplotlib>=3.8",
    "fastapi>=0.110",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
planner = ["data/*.yaml", "templates/*.html"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
